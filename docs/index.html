<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 챗봇</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    body { background: #f8f9fa; }

    #chat-box {
      height: calc(100vh - 180px);
      overflow-y: auto;
    }

    .bubble-user {
      background: #0d6efd;
      color: #fff;
      border-radius: 16px 16px 4px 16px;
    }

    .bubble-ai {
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 16px 16px 16px 4px;
      white-space: pre-wrap;
    }

    .meta { font-size: 0.72rem; color: #adb5bd; }
  </style>
</head>
<body>

<div class="container py-3" style="max-width: 720px;">

  <!-- 헤더 -->
  <div class="d-flex align-items-center mb-3 gap-2">
    <h5 class="mb-0 fw-bold">💬 AI 챗봇</h5>
    <select id="modelSelect" class="form-select form-select-sm w-auto ms-auto">
      <option value="flash">Gemini 3.1 Flash Lite</option>
      <option value="dense">Gemma 4 Dense</option>
      <option value="qwen">Qwen3 32B</option>
      <option value="llama">Llama 4 Scout</option>
    </select>
    <button id="clearBtn" type="button" class="btn btn-outline-secondary btn-sm">🗑️ 기억 지우기</button>
  </div>

  <!-- 대화 요약 (압축본) -->
  <div id="summary-box" class="alert alert-info py-2 px-3 mb-2 d-none" style="font-size: 0.85rem;">
    <strong>💡 대화 요약:</strong> <span id="summary-text"></span>
  </div>

  <!-- 채팅창 -->
  <div id="chat-box" class="border rounded bg-white p-3 mb-3 d-flex flex-column gap-3"></div>

  <!-- 입력창 -->
  <form id="form" class="d-flex gap-2">
    <textarea id="input" class="form-control" rows="1"
      placeholder="메시지를 입력하세요... (Shift+Enter: 줄바꿈)" style="resize:none;"></textarea>
    <button id="sendBtn" type="submit" class="btn btn-primary px-4">↑</button>
  </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="script.js"></script>
</body>
</html>
